window.medicalPdfData={register(path,data){
  const pending=pendingBytes.get(path);
  if(!pending)throw new Error("Unexpected PDF payload: "+path);
  pending.resolve(data);
  pending.received=true;
}};

function readPdfBytes(path,scriptPath){
  if(pendingBytes.has(path))return pendingBytes.get(path).promise;
  let resolve,reject;
  const promise=new Promise((yes,no)=>{resolve=yes;reject=no;});
  const pending={resolve,reject,promise,received:false};
  pendingBytes.set(path,pending);
  const script=document.createElement("script");
  script.src=scriptPath;
  script.onload=()=>{pendingBytes.delete(path);script.remove();if(!pending.received)reject(new Error("PDF payload did not register: "+path));};
  script.onerror=()=>{pendingBytes.delete(path);script.remove();reject(new Error("Cannot read local PDF payload: "+scriptPath));};
  document.head.append(script);
  return promise;
}
function pdfEngine(){
  if(!pdfEnginePromise)pdfEnginePromise=(async()=>{
    if(!window.medicalPdfRuntime)await new Promise((resolve,reject)=>{
      const script=document.createElement("script");
      script.src="assets/pdf-runtime.js";
      script.onload=()=>{script.remove();resolve();};
      script.onerror=()=>{script.remove();reject(new Error("Cannot read assets/pdf-runtime.js"));};
      document.head.append(script);
    });
    const runtime=window.medicalPdfRuntime;
    if(!runtime)throw new Error("Missing assets/pdf-runtime.js");
    const engineUrl=URL.createObjectURL(new Blob([decode64(runtime.engine)],{type:"text/javascript"}));
    const workerUrl=URL.createObjectURL(new Blob([decode64(runtime.worker)],{type:"text/javascript"}));
    const engine=await import(engineUrl);
    engine.GlobalWorkerOptions.workerSrc=workerUrl;
    // Opaque file origins cannot reliably create module workers in mobile WebKit.
    if(location.protocol==="file:")globalThis.pdfjsWorker=await import(workerUrl);
    class LocalBinaryDataFactory{
      async fetch({kind,filename}){
        const value=runtime.resources[kind]?.[filename];
        if(value===undefined)throw new Error("Missing bundled PDF resource: "+kind+"/"+filename);
        return decode64(value);
      }
    }
    return {engine,LocalBinaryDataFactory};
  })().catch(error=>{pdfEnginePromise=null;throw error;});
  return pdfEnginePromise;
}
function pdfSource(report,kind){

function getPdf(report,kind){
  const source=pdfSource(report,kind);

      const {engine,LocalBinaryDataFactory}=await pdfEngine();
      if(entry.disposed)throw new Error("PDF view was disposed");

function canvasRender(pdfPage,canvas,cssScale,pixelLimit=6000000){
  const cssViewport=pdfPage.getViewport({scale:cssScale});
  const density=Math.min(window.devicePixelRatio||1,2,Math.sqrt(pixelLimit/(cssViewport.width*cssViewport.height)));
  const viewport=pdfPage.getViewport({scale:cssScale*density});

  canvas.height=Math.max(1,Math.floor(viewport.height));
  canvas.style.width=cssViewport.width+"px";
  canvas.style.height=cssViewport.height+"px";
  return pdfPage.render({canvasContext:canvas.getContext("2d",{alpha:false}),viewport,background:"rgb(255,255,255)"});
}

  $("image-stage").hidden=true;$("pdf-stage").hidden=false;$("image-tools").hidden=true;$("pdf-tools").hidden=false;
  $("viewer-hint").textContent=t("pdfHint");$("slider-label").textContent=t("pagePosition");
  updatePdfModalControls();showViewer(true);renderModalPdf(true);
}
async function renderModalPdf(resetScroll=false){
  if(viewer?.kind!=="pdf")return;
  const state=viewer,sequence=++modalPdfSequence;
  if(modalPdfTask)modalPdfTask.cancel();
  $("viewer-pdf").dataset.rendered="loading";
  $("pdf-loading").hidden=false;$("pdf-error").hidden=true;
  try{
    const pdf=await getPdf(currentExam().reports[state.reportIndex],state.source);
    if(viewer!==state||sequence!==modalPdfSequence)return;
    state.count=pdf.numPages;state.page=Math.min(state.page,state.count);updatePdfModalControls();
    const page=await pdf.getPage(state.page);
    if(viewer!==state||sequence!==modalPdfSequence)return;
    const stage=$("pdf-stage"),base=page.getViewport({scale:1}),padding=matchMedia("(max-width:600px)").matches?24:44;
    const fitScale=Math.min((stage.clientWidth-padding)/base.width,(stage.clientHeight-padding)/base.height);
    modalPdfTask=canvasRender(page,$("viewer-pdf"),fitScale*state.zoom);
    await modalPdfTask.promise;
    if(viewer!==state||sequence!==modalPdfSequence)return;
    $("pdf-loading").hidden=true;$("viewer-pdf").dataset.rendered=state.source+"-"+state.page;
    $("viewer-pdf").setAttribute("aria-label",t(state.source)+" · "+state.page+" / "+state.count);
    if(resetScroll){stage.scrollLeft=0;stage.scrollTop=0;}
  }catch(error){
    if(error.name==="RenderingCancelledException"||viewer!==state||sequence!==modalPdfSequence)return;
    console.error("Fullscreen PDF failed",error);
    $("pdf-loading").hidden=true;$("pdf-error").hidden=false;$("pdf-error").textContent=t("renderingError")+" "+error.message+" "+t("pdfError");
  }
}
function stepPage(amount){
  if(viewer?.kind!=="pdf")return;
  const page=Math.min(viewer.count,Math.max(1,viewer.page+amount));
  if(page===viewer.page)return;
  viewer.page=page;updatePdfModalControls();renderModalPdf(true);
}
function changePdfZoom(value){
  if(viewer?.kind!=="pdf")return;
  viewer.zoom=Math.min(6,Math.max(1,value));updatePdfModalControls();renderModalPdf(value===1);
}
function switchPdfSource(kind){
  if(viewer?.kind!=="pdf"||viewer.source===kind)return;
  viewer.source=kind;viewer.page=1;viewer.zoom=1;
  viewer.count=pdfSource(currentExam().reports[viewer.reportIndex],kind).count;
  updatePdfModalControls();renderModalPdf(true);
}
$("lang-zh").addEventListener("click",()=>{language="zh";renderLanguage();});
$("lang-en").addEventListener("click",()=>{language="en";renderLanguage();});
$("search").addEventListener("input",applyFilters);
for(const id of ["year-filter","modality-filter","body-filter"])$(id).addEventListener("change",applyFilters);
$("reset-filters").addEventListener("click",()=>{for(const id of ["search","year-filter","modality-filter","body-filter"])$(id).value="";applyFilters();});
$("timeline").addEventListener("click",event=>{const card=event.target.closest("[data-exam]");if(card)selectExam(card.dataset.exam,true);});
$("exam-detail").addEventListener("click",event=>{
  const tab=event.target.closest("[data-tab]"),series=event.target.closest("[data-series]"),card=event.target.closest(".pdf-card");
  if(tab){setTab(tab.dataset.tab);return;}
  if(series){openSeries(Number(series.dataset.series));return;}
  if(!card)return;
  if(event.target.closest("[data-open-pdf]"))openPdf(Number(card.dataset.reportIndex),card.dataset.pdfKind);
});
$("exam-detail").addEventListener("load",event=>{if(event.target.matches(".pdf-cover"))event.target.closest(".pdf-card").dataset.rendered="true";},true);
$("exam-detail").addEventListener("error",event=>{if(event.target.matches(".pdf-cover")){const card=event.target.closest(".pdf-card");card.dataset.rendered="error";card.querySelector(".pdf-status").hidden=false;}},true);
$("exam-detail").addEventListener("toggle",event=>{if(event.target.matches("[data-report-text]"))loadReportText(event.target);},true);
$("exam-detail").addEventListener("keydown",event=>{
  if(event.target.matches(".pdf-preview")&&(event.key==="Enter"||event.code==="Space")){event.preventDefault();event.target.click();}
  if(event.target.matches("[role=tab]")&&["ArrowLeft","ArrowRight","Home","End"].includes(event.key)){event.preventDefault();const tab=event.key==="Home"?"reports":event.key==="End"?"images":activeTab==="reports"?"images":"reports";setTab(tab);$("tab-"+tab).focus();}
});
$("mobile-timeline").addEventListener("click",()=>{$("sidebar").classList.contains("open")?closeSidebar():openSidebar();});
$("close-sidebar").addEventListener("click",()=>closeSidebar());
$("drawer-backdrop").addEventListener("click",()=>closeSidebar());
$("close-viewer").addEventListener("click",closeViewer);
$("viewer").addEventListener("cancel",event=>{event.preventDefault();closeViewer();});
$("system-fullscreen").addEventListener("click",requestSystemFullscreen);
$("previous-frame").addEventListener("click",()=>stepFrame(-1));
$("next-frame").addEventListener("click",()=>stepFrame(1));
$("play").addEventListener("click",togglePlay);
$("frame-slider").addEventListener("input",()=>{if(viewer?.kind==="images"){pause();loadFrame(Number($("frame-slider").value)-1);}else if(viewer?.kind==="pdf"){viewer.page=Number($("frame-slider").value);updatePdfModalControls();renderModalPdf(true);}});
$("series-picker").addEventListener("change",()=>openSeries(Number($("series-picker").value),false));
$("zoom-in").addEventListener("click",()=>changeImageZoom(zoom*1.25));
$("zoom-out").addEventListener("click",()=>changeImageZoom(zoom/1.25));
$("reset-zoom").addEventListener("click",()=>changeImageZoom(1));
$("speed").addEventListener("change",()=>{if(playing)loadFrame(viewer.index);});
$("previous-page").addEventListener("click",()=>stepPage(-1));
$("next-page").addEventListener("click",()=>stepPage(1));
$("pdf-zoom-in").addEventListener("click",()=>changePdfZoom(viewer.zoom*1.25));
$("pdf-zoom-out").addEventListener("click",()=>changePdfZoom(viewer.zoom/1.25));
$("pdf-fit").addEventListener("click",()=>changePdfZoom(1));
$("pdf-source-original").addEventListener("click",()=>switchPdfSource("original"));
$("pdf-source-translation").addEventListener("click",()=>switchPdfSource("translation"));
let wheelDelta=0;
$("image-stage").addEventListener("wheel",event=>{event.preventDefault();if(event.ctrlKey||event.metaKey){changeImageZoom(zoom*Math.exp(-event.deltaY/250));return;}wheelDelta+=event.deltaY;if(Math.abs(wheelDelta)>=35){stepFrame(wheelDelta>0?1:-1);wheelDelta=0;}},{passive:false});
$("pdf-stage").addEventListener("wheel",event=>{if((event.ctrlKey||event.metaKey)&&viewer?.kind==="pdf"){event.preventDefault();changePdfZoom(viewer.zoom*Math.exp(-event.deltaY/250));}},{passive:false});
const pointers=new Map();
let gesture=null;
const distance=()=>{const values=[...pointers.values()];return Math.hypot(values[0].x-values[1].x,values[0].y-values[1].y);};
$("image-stage").addEventListener("pointerdown",event=>{
  if(event.button!==0)return;
  $("image-stage").setPointerCapture(event.pointerId);pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
  if(pointers.size===1)gesture={x:event.clientX,y:event.clientY,panX,panY,pinch:false};
  else if(pointers.size===2)gesture={...gesture,pinch:true,distance:distance(),zoom};
});
$("image-stage").addEventListener("pointermove",event=>{
  if(!pointers.has(event.pointerId)||!gesture)return;
  pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
  if(pointers.size===2)changeImageZoom(gesture.zoom*distance()/Math.max(1,gesture.distance));
  else if(!gesture.pinch&&zoom>1){panX=gesture.panX+event.clientX-gesture.x;panY=gesture.panY+event.clientY-gesture.y;updateImageTransform();}
});
function finishPointer(event,cancelled=false){
  if(!pointers.has(event.pointerId))return;
  if(!cancelled&&pointers.size===1&&gesture&&!gesture.pinch&&zoom===1){const dx=event.clientX-gesture.x,dy=event.clientY-gesture.y;if(Math.max(Math.abs(dx),Math.abs(dy))>45)stepFrame((Math.abs(dx)>Math.abs(dy)?-dx:-dy)>0?1:-1);}
  pointers.delete(event.pointerId);if(!pointers.size)gesture=null;
}
$("image-stage").addEventListener("pointerup",event=>finishPointer(event));
$("image-stage").addEventListener("pointercancel",event=>finishPointer(event,true));
document.addEventListener("keydown",event=>{
  if($("sidebar").classList.contains("open")&&matchMedia("(max-width:860px)").matches){
    if(event.key==="Escape"){event.preventDefault();closeSidebar();return;}
    if(event.key==="Tab"){const nodes=[...$("sidebar").querySelectorAll("button,input,select,a")].filter(node=>!node.hidden&&!node.disabled&&node.getClientRects().length),first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  }
  if(!$("viewer").open||["INPUT","SELECT","TEXTAREA"].includes(event.target.tagName))return;
  if(["ArrowRight","ArrowDown"].includes(event.key)){event.preventDefault();viewer.kind==="images"?stepFrame(1):stepPage(1);}
  else if(["ArrowLeft","ArrowUp"].includes(event.key)){event.preventDefault();viewer.kind==="images"?stepFrame(-1):stepPage(-1);}
  else if(event.code==="Space"&&viewer.kind==="images"&&(event.target.tagName!=="BUTTON"||event.target.id==="play")){event.preventDefault();togglePlay();}
  else if(event.key==="Home"){event.preventDefault();if(viewer.kind==="images"){pause();loadFrame(0);}else{viewer.page=1;updatePdfModalControls();renderModalPdf(true);}}
  else if(event.key==="End"){event.preventDefault();if(viewer.kind==="images"){pause();loadFrame(viewer.set.paths.length-1);}else{viewer.page=viewer.count;updatePdfModalControls();renderModalPdf(true);}}
  else if(event.key==="+"||event.key==="="){event.preventDefault();viewer.kind==="images"?changeImageZoom(zoom*1.25):changePdfZoom(viewer.zoom*1.25);}
  else if(event.key==="-"){event.preventDefault();viewer.kind==="images"?changeImageZoom(zoom/1.25):changePdfZoom(viewer.zoom/1.25);}
});
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause();});
window.addEventListener("hashchange",()=>{const exam=archive.exams.find(item=>item.id===location.hash.slice(1));if(exam){for(const id of ["search","year-filter","modality-filter","body-filter"])$(id).value="";selectExam(exam.id);}});
window.addEventListener("resize",()=>{
  if(!matchMedia("(max-width:860px)").matches&&$("sidebar").classList.contains("open"))closeSidebar(false);
  $("sidebar").inert=matchMedia("(max-width:860px)").matches&&!$("sidebar").classList.contains("open");
  clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(viewer?.kind==="pdf")renderModalPdf();},160);
});
renderLanguage();closeSidebar(false);
</script>
